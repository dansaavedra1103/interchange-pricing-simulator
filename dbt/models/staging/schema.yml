version: 2

models:
  - name: stg_transactions
    description: Card purchases as generated, typed and renamed. No fees yet.
    columns:
      - name: txn_id
        data_tests: [unique, not_null]
      - name: txn_date
        data_tests: [not_null]
      - name: amount_cop
        description: Purchase amount in whole Colombian pesos.
        data_tests: [not_null]
      - name: channel
        description: Card present (cp) or card not present (cnp).
        data_tests:
          - accepted_values:
              arguments:
                values: ["cp", "cnp"]

  - name: stg_merchants
    description: Merchants, domestic first and then foreign.
    columns:
      - name: merchant_id
        data_tests: [unique, not_null]
      - name: pricing_model
        description: >
          How the merchant pays: blended (flat rate of its group) or IC++ (interchange and
          network fees passed through, plus the acquirer's markup).
        data_tests:
          - accepted_values:
              arguments:
                values: ["blended", "icpp"]
      - name: sector_margin
        description: Net margin of the merchant's sector, the base of the relative burden.
        data_tests: [not_null]

  - name: stg_cardholders
    description: One row per card.
    columns:
      - name: cardholder_id
        data_tests: [unique, not_null]

  - name: stg_issuers
    description: Card issuers.
    columns:
      - name: issuer_id
        data_tests: [unique, not_null]

  - name: stg_acquirers
    description: Merchant acquirers.
    columns:
      - name: acquirer_id
        data_tests: [unique, not_null]

  - name: stg_mccs
    description: MCC dimension with group-level business parameters.
    columns:
      - name: mcc
        data_tests: [unique, not_null]
      - name: blended_mdr_rate
        description: Flat rate merchants of the group pay on blended pricing.
        data_tests: [not_null]

  - name: stg_interchange_table
    description: One row per interchange cell (product x MCC group x channel x region).
    columns:
      - name: region
        data_tests:
          - accepted_values:
              arguments:
                values: ["domestic", "cross_border"]
      - name: rate
        data_tests: [not_null]

  - name: stg_network_fees
    description: The network's fee schedule for issuers and acquirers, a single row.
    columns:
      - name: acquirer_assessment_rate
        data_tests: [not_null]
      - name: issuer_assessment_rate
        data_tests: [not_null]

  - name: stg_pricing_terms
    description: IC++ markup and blended surcharge on foreign cards of each acquirer.
    columns:
      - name: acquirer_id
        data_tests: [unique, not_null]
      - name: icpp_markup_rate
        data_tests: [not_null]
      - name: blended_cross_border_rate
        data_tests: [not_null]
