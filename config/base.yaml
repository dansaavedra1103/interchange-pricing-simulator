# Parámetros globales del Interchange Pricing Simulator (Feature 1 en adelante).
# Datos 100% sintéticos. Cada valor de negocio está documentado en docs/assumptions.md como
# [D] dato público, [L] literatura, [S] spec o [P] supuesto propio.
# Tasas y probabilidades en fracción decimal (0.02 = 2 %).

seed: 20260910

# 24 meses: dos ciclos anuales para que el forecasting (Feature 8) vea estacionalidad.
dates:
  start: 2024-01-01
  end: 2025-12-31

# Cardholder = tarjeta. 6M compras / 150k tarjetas / 2 años = 20 compras por tarjeta al año
# (Superfinanciera, Reporte de Inclusión Financiera 2022: 19-26 compras por tarjeta al año).
sizes:
  n_cardholders: 150000
  n_merchants: 30000
  n_foreign_merchants: 600
  n_transactions: 6000000

# Muestra con los mismos parámetros y 30 veces menos compras: tests, CI y `generate --sample`.
sample_sizes:
  n_cardholders: 6000
  n_merchants: 1500
  n_foreign_merchants: 60
  n_transactions: 200000

output:
  raw_dir: data/raw
  warehouse_path: data/warehouse/ips.duckdb

includes:
  mcc_groups: config/mcc_groups.yaml
  interchange_table: config/interchange_table.yaml
  economics: config/economics.yaml

products: [debit, credit_standard, credit_premium, commercial]

geography:
  country: CO
  # Población de las siete áreas urbanas en millones (DANE, proyección 2023): Bogotá incluye
  # Soacha, Medellín incluye Bello y Barranquilla incluye Soledad.
  cities:
    bogota: 8.80
    medellin: 3.23
    cali: 2.30
    barranquilla: 2.02
    cartagena: 1.07
    cucuta: 0.80
    bucaramanga: 0.62
  # Fracción de tarjetas y comercios en el resto del país (menor penetración de tarjetas).
  other_cities_share: 0.35
  # Probabilidad de que una compra presencial ocurra en la ciudad de residencia.
  p_home_city: 0.92

# Emisores ficticios. market_share = fracción de las tarjetas. bank_group identifica al grupo
# financiero: si coincide con el del adquirente del comercio, la transacción es on-us.
issuers:
  - {issuer_id: ISS_BANK_A, issuer_type: bank, size: large, bank_group: BANK_A, product_mix: bank_large, market_share: 0.24}
  - {issuer_id: ISS_BANK_B, issuer_type: bank, size: large, bank_group: BANK_B, product_mix: bank_large, market_share: 0.18}
  - {issuer_id: ISS_BANK_C, issuer_type: bank, size: large, bank_group: BANK_C, product_mix: bank_large, market_share: 0.12}
  - {issuer_id: ISS_BANK_D, issuer_type: bank, size: medium, bank_group: BANK_D, product_mix: bank_medium, market_share: 0.08}
  - {issuer_id: ISS_BANK_E, issuer_type: bank, size: medium, bank_group: BANK_E, product_mix: bank_medium, market_share: 0.07}
  - {issuer_id: ISS_BANK_F, issuer_type: bank, size: medium, bank_group: BANK_F, product_mix: bank_medium, market_share: 0.05}
  - {issuer_id: ISS_BANK_G, issuer_type: bank, size: small, bank_group: BANK_G, product_mix: bank_small, market_share: 0.04}
  - {issuer_id: ISS_BANK_H, issuer_type: bank, size: small, bank_group: BANK_H, product_mix: bank_small, market_share: 0.03}
  - {issuer_id: ISS_FINTECH_I, issuer_type: fintech, size: medium, bank_group: null, product_mix: fintech, market_share: 0.12}
  - {issuer_id: ISS_FINTECH_J, issuer_type: fintech, size: small, bank_group: null, product_mix: fintech, market_share: 0.07}

# P(producto | mix del emisor). Calibrado para que ~74 % de las tarjetas sean débito
# (Superfinanciera 2022: 45,8M débito vs 16M crédito); los bancos grandes emiten más premium
# y comercial, las fintech casi solo débito.
product_mix:
  bank_large: {debit: 0.66, credit_standard: 0.19, credit_premium: 0.10, commercial: 0.05}
  bank_medium: {debit: 0.74, credit_standard: 0.17, credit_premium: 0.06, commercial: 0.03}
  bank_small: {debit: 0.82, credit_standard: 0.13, credit_premium: 0.04, commercial: 0.01}
  fintech: {debit: 0.92, credit_standard: 0.07, credit_premium: 0.01, commercial: 0.00}

# Segmento de gasto según el producto. La actividad (compras relativas) es log-normal por
# segmento; con este mix el crédito compra ~1,34x lo que el débito y el débito queda en ~68 %
# de las compras (Superfinanciera 2022: 878M compras débito vs 416M crédito).
spend_segments:
  mix:
    debit: {low: 0.45, mid: 0.42, high: 0.13}
    credit_standard: {low: 0.30, mid: 0.50, high: 0.20}
    credit_premium: {low: 0.10, mid: 0.40, high: 0.50}
    commercial: {low: 0.10, mid: 0.40, high: 0.50}
  activity_median: {low: 0.5, mid: 1.0, high: 2.0}
  activity_sigma: 0.6

# Segmentos latentes de estilo de vida: definen preferencias por grupo de MCC y la clientela
# de los comercios. No se escriben en las tablas observables (solo en data/raw/latent/).
lifestyle:
  mix:
    debit: {household: 0.34, young_urban: 0.24, traveler: 0.04, business: 0.02, driver: 0.14, student: 0.22}
    credit_standard: {household: 0.34, young_urban: 0.22, traveler: 0.14, business: 0.06, driver: 0.18, student: 0.06}
    credit_premium: {household: 0.20, young_urban: 0.15, traveler: 0.40, business: 0.15, driver: 0.08, student: 0.02}
    commercial: {household: 0.02, young_urban: 0.03, traveler: 0.10, business: 0.75, driver: 0.10, student: 0.00}
  # Proporción base de compras por grupo; cada segmento la multiplica por sus boosts.
  base_group_mix: {grocery: 0.24, fuel: 0.07, utilities_telecom: 0.06, restaurants: 0.14, health: 0.07, retail: 0.14, home_electronics: 0.04, travel: 0.03, transport: 0.09, digital: 0.06, education: 0.02, entertainment: 0.04}
  boosts:
    household: {grocery: 1.6, health: 1.5, utilities_telecom: 1.5, home_electronics: 1.3, entertainment: 0.7, travel: 0.5}
    young_urban: {restaurants: 1.8, entertainment: 1.8, digital: 1.8, transport: 1.5, grocery: 0.6, utilities_telecom: 0.6}
    traveler: {travel: 4.0, restaurants: 1.4, retail: 1.3, digital: 1.2, grocery: 0.6}
    business: {travel: 3.0, fuel: 1.8, restaurants: 1.5, home_electronics: 1.3, grocery: 0.4, education: 0.3}
    driver: {fuel: 3.5, transport: 0.5, home_electronics: 1.3, grocery: 1.1}
    student: {education: 4.0, digital: 1.8, transport: 1.8, restaurants: 1.3, home_electronics: 0.5, travel: 0.5}
  # Concentración de la Dirichlet de preferencias individuales alrededor del prototipo.
  preference_concentration: 15.0

affinity:
  # Cuánto más probable es elegir un comercio cuya clientela coincide con el segmento.
  clientele_boost: 4.0
  # Probabilidad de que una compra vaya a uno de los comercios habituales del grupo.
  p_habit: 0.6
  # Peso de cada comercio habitual por grupo (Zipf truncada).
  favorite_weights: [0.6, 0.3, 0.1]

merchants:
  # Peso de volumen del comercio ~ LogNormal(0, sigma): pocos comercios concentran volumen.
  size_sigma: 1.2
  # Fracción de comercios en cada tramo, de mayor a menor peso de volumen.
  size_tiers: {large: 0.01, medium: 0.09, small: 0.30, micro: 0.60}
  # Tramos a los que los adquirentes bancarios (pricing_model mixed) cobran IC++; el resto de
  # sus comercios paga blended (spec §1.5).
  icpp_tiers: [large, medium]
  # Heterogeneidad del margen dentro del grupo: margen = margen del grupo x LogNormal(0, sigma).
  sector_margin_sigma: 0.25

# Adquirentes domésticos. tier_shares = participación en cada tramo de tamaño de comercio:
# los bancos dominan los comercios grandes y los agregadores los micro. La asignación no mira
# al emisor de los clientes, así que adquirente y emisor son independientes (spec §1.1).
acquirers:
  - {acquirer_id: ACQ_BANK_A, acquirer_type: bank, bank_group: BANK_A, pricing_model: mixed, tier_shares: {large: 0.35, medium: 0.30, small: 0.20, micro: 0.10}}
  - {acquirer_id: ACQ_BANK_B, acquirer_type: bank, bank_group: BANK_B, pricing_model: mixed, tier_shares: {large: 0.30, medium: 0.25, small: 0.15, micro: 0.08}}
  - {acquirer_id: ACQ_BANK_C, acquirer_type: bank, bank_group: BANK_C, pricing_model: mixed, tier_shares: {large: 0.20, medium: 0.15, small: 0.10, micro: 0.05}}
  - {acquirer_id: ACQ_AGG_X, acquirer_type: aggregator, bank_group: null, pricing_model: blended, tier_shares: {large: 0.10, medium: 0.15, small: 0.25, micro: 0.35}}
  - {acquirer_id: ACQ_AGG_Y, acquirer_type: aggregator, bank_group: null, pricing_model: blended, tier_shares: {large: 0.05, medium: 0.10, small: 0.20, micro: 0.27}}
  - {acquirer_id: ACQ_AGG_Z, acquirer_type: aggregator, bank_group: null, pricing_model: blended, tier_shares: {large: 0.00, medium: 0.05, small: 0.10, micro: 0.15}}

channel:
  # Fracción de las compras no presentes que usan token (red o billetera).
  p_tokenized_cnp: 0.5

cross_border:
  # Fracción de las compras de cada tarjeta hechas en comercios del exterior: baja y
  # concentrada en premium y comercial (spec §2.3). El segmento viajero la duplica.
  propensity: {debit: 0.005, credit_standard: 0.02, credit_premium: 0.06, commercial: 0.05}
  segment_multiplier: {traveler: 2.0}
  # Probabilidad de que una compra en el exterior sea online.
  online_share: 0.85
  # Comercios extranjeros: grupos, países y canal.
  groups: {digital: 0.50, travel: 0.30, retail: 0.20}
  countries: {US: 0.45, ES: 0.15, MX: 0.15, PA: 0.10, BR: 0.15}
  merchant_channel: {cp: 0.15, cnp: 0.60, mixed: 0.25}
  acquirer: {acquirer_id: ACQ_FOREIGN, acquirer_type: foreign, country: ZZ, pricing_model: blended}

seasonality:
  # Factor mensual de actividad (enero..diciembre): pico en diciembre, prima en junio.
  month_factors: [0.90, 0.92, 0.97, 0.96, 1.00, 1.04, 1.02, 0.99, 0.98, 1.00, 1.06, 1.30]
  # Crecimiento anual del número de compras con tarjeta (BanRep: +19 % en 2025).
  annual_growth: 0.19
  # Quincena: días de pago de nómina con más actividad.
  payday_days: [1, 14, 15, 16, 29, 30, 31]
  payday_boost: 1.15

amounts:
  min_amount_cop: 1000
  # Multiplicador del ticket mediano según producto: premium y comercial compran más caro.
  # Calibrado para un ticket promedio de ~131k COP en débito y ~244k en crédito
  # (Superfinanciera 2022: 114k y 212k, ajustados por ~15 % de inflación 2023-2024).
  product_multiplier: {debit: 0.75, credit_standard: 1.0, credit_premium: 1.35, commercial: 1.65}

fraud:
  # Calibrado para que el resultado reproduzca la estructura del BCE (2023) y el nivel de la
  # spec §1.6: el no presente concentra ~84 % del valor defraudado, el cross-border defrauda
  # ~14x lo doméstico (63 % del fraude con 11 % del volumen) y el total es ~0,08 % del valor.
  # Probabilidad base por transacción según canal, antes de multiplicadores.
  base_rate: {cp: 0.000174, cnp: 0.00099}
  cross_border_multiplier: 6.4
  tokenized_multiplier: 0.5
  p_chargeback_given_fraud: 0.8
