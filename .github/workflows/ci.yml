name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        # torch from the CPU index first: the default Linux wheel pulls the CUDA runtimes (GBs).
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,pipeline,graph,gnn]"
      - name: Lint and tests
        run: python -m ips.tasks test
      - name: Generate the sample dataset
        run: python -m ips.tasks generate --sample
      - name: dbt build
        run: python -m ips.tasks dbt
      - name: Segment merchants
        run: python -m ips.tasks segment
      - name: Elasticity and link prediction
        run: python -m ips.tasks elasticity
      - name: Scenarios
        run: python -m ips.tasks simulate
