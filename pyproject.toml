[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ips"
version = "0.0.1"
description = "Interchange pricing simulator for four-party payment networks (synthetic data)."
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "numpy>=1.26",
    "polars>=1.0",
    "pyarrow>=15",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "igraph>=0.11",
    "ipykernel>=6.29",
    "matplotlib>=3.8",
    "nbclient>=0.10",
    "nbformat>=5.9",
    "pytest>=8.0",
    "ruff>=0.6",
]
pipeline = ["dbt-duckdb>=1.8"]
graph = ["scikit-learn>=1.5", "scipy>=1.11"]
# Install torch from the CPU index first, or pip pulls the CUDA build and its NVIDIA runtimes:
#   pip install torch --index-url https://download.pytorch.org/whl/cpu
gnn = ["torch>=2.2", "torch-geometric>=2.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -m 'not slow'"
markers = ["slow: full-scale generation checks, run with `pytest -m slow`"]
filterwarnings = [
    # pyzmq on Windows (Proactor event loop) warns when the notebook kernel starts; harmless.
    "ignore:Proactor event loop does not implement add_reader:RuntimeWarning",
    # torch_geometric still imports torch.jit.script at module level; nothing we can act on.
    "ignore:`torch.jit.script` is deprecated:FutureWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
