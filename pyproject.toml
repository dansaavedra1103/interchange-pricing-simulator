[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ips"
version = "0.0.1"
description = "Interchange pricing simulator for four-party payment networks (synthetic data)."
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "numpy>=1.26",
    "polars>=1.0",
    "pyarrow>=15",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.29",
    "nbclient>=0.10",
    "nbformat>=5.9",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
filterwarnings = [
    # pyzmq on Windows (Proactor event loop) warns when the notebook kernel starts; harmless.
    "ignore:Proactor event loop does not implement add_reader:RuntimeWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
